# Development stack — source bind-mounted, hot-reload enabled.
# Separate project name and volumes so dev and production data never mix.
#
# Usage:
#   docker network create aidt-ai-net        # một lần, xem khối `networks:`
#   docker compose -f docker-compose.dev.yml up --build
#
# Then open http://localhost:8069 (database manager is enabled in dev).
#
# Remote debugging (VS Code "attach" on port 5678):
#   docker compose -f docker-compose.dev.yml run --rm --service-ports odoo \
#     python -m debugpy --listen 0.0.0.0:5678 --wait-for-client \
#     /opt/odoo/odoo-bin -c /etc/odoo/odoo.conf

name: aidt-odoo-dev

services:
  db:
    # Ghim phiên bản pgvector tường minh, KHÔNG dùng tag trôi `pg16`.
    # aidt_search phụ thuộc vào hành vi theo phiên bản của pgvector:
    # `hnsw.iterative_scan` (search_service._set_hnsw_iterative_scan) chỉ có
    # từ 0.8.0. Tag trôi nghĩa là một `docker compose pull` bất kỳ có thể đổi
    # phiên bản dưới chân mà không ai chủ động quyết định — đúng loại thay đổi
    # phải là một lần nâng cấp có ý thức, không phải một tác dụng phụ.
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${DB_PASSWORD:-odoo}
      POSTGRES_DB: postgres
    volumes:
      - db-data-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  odoo:
    build:
      context: .
      target: dev
    # reload: restart on Python changes; qweb: client-side template debugging.
    #
    # `xml` (read view arch from file, so view edits apply without -u) is NOT in
    # the default: it disables three server caches — the postprocessed-view cache
    # (ir_ui_view.py:3088), the record-rule domain cache (ir_rule.py:137), and it
    # re-parses every view's XML file per render (ir_ui_view.py:224). Measured
    # cost: login page 0.03s -> 0.75s, webclient ~3.5s. Opt in only while
    # iterating on view XML:
    #   ODOO_DEV=reload,qweb,xml docker compose -f docker-compose.dev.yml up
    command: ["odoo", "--addons-path=/opt/odoo/addons,/opt/odoo/extra-addons/dms,/opt/odoo/custom-addons", "--dev=${ODOO_DEV:-reload,qweb}"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: odoo
      DB_PASSWORD: ${DB_PASSWORD:-odoo}
      ODOO_ADMIN_PASSWD: ${ODOO_ADMIN_PASSWD:-admin}
      ODOO_WORKERS: "0"        # threaded mode — required for --dev and debuggers
      ODOO_LIST_DB: "True"
      # Lặp lại có chủ ý những gì Dockerfile đã ENV sẵn ở stage `runtime`
      # (xem khối giải thích dài ở đó): OpenBLAS đặt trước ~600 MiB địa chỉ
      # ảo cho các luồng nó không dùng, `limit_memory_soft` của Odoo lại đo
      # địa chỉ ảo, nên server vượt ngưỡng ngay lúc khởi động và tự restart
      # vô tận.
      #
      # ẢNH mới là nguồn đúng, KHÔNG phải bốn dòng này. Ngày 06/08/2026 bốn
      # dòng ở đây từng che mất một lỗi thật: `ENV` trong Dockerfile bị đặt
      # nhầm ở stage `builder`, mà `ENV` không đi qua một `FROM` mới — nên
      # ảnh chạy thật chưa từng có bản vá, dev vẫn đúng nhờ chính bốn dòng
      # này, còn production (docker-compose.yml, không lặp lại) thì dính
      # nguyên vòng lặp restart. Giữ lại như một lớp dự phòng, nhưng khi kiểm
      # tra bản vá thì phải kiểm TRONG ẢNH:
      #   docker run --rm --entrypoint sh <ảnh> -c 'env | grep NUM_THREADS'
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      ODOO_LOG_LEVEL: ${ODOO_LOG_LEVEL:-info}
    volumes:
      - .:/opt/odoo            # live source — host edits apply immediately
      - odoo-filestore-dev:/var/lib/odoo
    ports:
      - "8069:8069"  # HTTP (websocket is served here too in threaded mode)
      - "5678:5678"  # debugpy
    # `default` giữ kết nối với db; `aidt-ai-net` để gọi sang tầng AI của
    # docker-compose.ai.yml (aidt-asr, aidt-llm) — cùng hình dạng với
    # docker-compose.yml. Thiếu dòng này thì container odoo KHÔNG phân giải
    # được tên `aidt-asr`/`aidt-llm`, và aidt_meeting_minutes chỉ báo
    # "Connection refused" ghi vào `summary_error` chứ không hỏng ra ngoài —
    # tức là im lặng. Đã phải nối tay bằng `docker network connect` để chạy
    # được lượt kiểm thử đầu-cuối đầu tiên; nối tay thì mất sau mỗi
    # `docker compose down`.
    #
    # `aidt-embed` bên dưới KHÔNG vào mạng này: nó là bản dev riêng của
    # service cùng tên trong tầng AI, để hai bản không đụng tên nhau.
    networks: [default, aidt-ai-net]

  aidt-embed:
    image: vllm/vllm-openai:latest
    command:
      - --model=AITeamVN/Vietnamese_Embedding
      - --served-model-name=AITeamVN/Vietnamese_Embedding
      # --task=embed was removed in vLLM 0.26; replacement is --runner=pooling + --convert=embed
      - --runner=pooling
      - --convert=embed
      - --gpu-memory-utilization=0.15
      - --max-model-len=2048
      - --host=0.0.0.0
      - --port=8001
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    ports:
      - "8001:8001"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

volumes:
  db-data-dev:
  odoo-filestore-dev:

# Tầng AI nằm ở docker-compose.ai.yml riêng. Hai compose project khác nhau
# KHÔNG nói chuyện được qua default bridge, nên bắt buộc phải có một network
# đặt tên chung. Cùng khai báo với docker-compose.yml.
#
# `external: true` nghĩa là network phải TỒN TẠI TRƯỚC — tạo một lần bằng
# `docker network create aidt-ai-net` (xem phần Usage ở đầu file). Không cần
# tầng AI đang chạy: mạng rỗng thì tên chỉ đơn giản là không phân giải được,
# stack web vẫn lên bình thường.
networks:
  aidt-ai-net:
    external: true
    name: aidt-ai-net
