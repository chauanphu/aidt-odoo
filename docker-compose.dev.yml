# Development stack — source bind-mounted, hot-reload enabled.
# Separate project name and volumes so dev and production data never mix.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up --build
#
# Then open http://localhost:8069 (database manager is enabled in dev).
#
# Remote debugging (VS Code "attach" on port 5678):
#   docker compose -f docker-compose.dev.yml run --rm --service-ports odoo \
#     python -m debugpy --listen 0.0.0.0:5678 --wait-for-client \
#     /opt/odoo/odoo-bin -c /etc/odoo/odoo.conf

name: aidt-odoo-dev

services:
  db:
    # Ghim phiên bản pgvector tường minh, KHÔNG dùng tag trôi `pg16`.
    # aidt_search phụ thuộc vào hành vi theo phiên bản của pgvector:
    # `hnsw.iterative_scan` (search_service._set_hnsw_iterative_scan) chỉ có
    # từ 0.8.0. Tag trôi nghĩa là một `docker compose pull` bất kỳ có thể đổi
    # phiên bản dưới chân mà không ai chủ động quyết định — đúng loại thay đổi
    # phải là một lần nâng cấp có ý thức, không phải một tác dụng phụ.
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${DB_PASSWORD:-odoo}
      POSTGRES_DB: postgres
    volumes:
      - db-data-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  odoo:
    build:
      context: .
      target: dev
    # reload: restart on Python changes; qweb: client-side template debugging.
    #
    # `xml` (read view arch from file, so view edits apply without -u) is NOT in
    # the default: it disables three server caches — the postprocessed-view cache
    # (ir_ui_view.py:3088), the record-rule domain cache (ir_rule.py:137), and it
    # re-parses every view's XML file per render (ir_ui_view.py:224). Measured
    # cost: login page 0.03s -> 0.75s, webclient ~3.5s. Opt in only while
    # iterating on view XML:
    #   ODOO_DEV=reload,qweb,xml docker compose -f docker-compose.dev.yml up
    command: ["odoo", "--addons-path=/opt/odoo/addons,/opt/odoo/extra-addons/dms,/opt/odoo/custom-addons", "--dev=${ODOO_DEV:-reload,qweb}"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: odoo
      DB_PASSWORD: ${DB_PASSWORD:-odoo}
      ODOO_ADMIN_PASSWD: ${ODOO_ADMIN_PASSWD:-admin}
      ODOO_WORKERS: "0"        # threaded mode — required for --dev and debuggers
      ODOO_LIST_DB: "True"
      ODOO_LOG_LEVEL: ${ODOO_LOG_LEVEL:-info}
    volumes:
      - .:/opt/odoo            # live source — host edits apply immediately
      - odoo-filestore-dev:/var/lib/odoo
    ports:
      - "8069:8069"  # HTTP (websocket is served here too in threaded mode)
      - "5678:5678"  # debugpy

  aidt-embed:
    image: vllm/vllm-openai:latest
    command:
      - --model=AITeamVN/Vietnamese_Embedding
      - --served-model-name=AITeamVN/Vietnamese_Embedding
      # --task=embed was removed in vLLM 0.26; replacement is --runner=pooling + --convert=embed
      - --runner=pooling
      - --convert=embed
      - --gpu-memory-utilization=0.15
      - --max-model-len=2048
      - --host=0.0.0.0
      - --port=8001
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    ports:
      - "8002:8001"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  aidt-ocr:
    build:
      context: /home/ai_server_1/docker_unlimited_ocr
    image: aidt-unlimited-ocr:latest
    container_name: aidt-odoo-dev-ocr-1
    ports:
      - "8003:8000"
    volumes:
      - /home/ai_server_1/docker_unlimited_ocr:/workspace
    environment:
      - PORT=8000
      - CUDA_VISIBLE_DEVICES=
    restart: unless-stopped

  aidt-pipeline:
    build:
      context: /home/ai_server_1/docker_unlimited_ocr
      dockerfile: Dockerfile
    image: aidt-pipeline-backend:latest
    container_name: aidt-odoo-dev-pipeline-1
    command: ["python3", "server/main.py"]
    ports:
      - "8001:8001"
    volumes:
      - /home/ai_server_1/docker_unlimited_ocr:/workspace
    environment:
      - OCR_URL=http://aidt-ocr:8000
      - OLLAMA_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - aidt-ocr
    restart: unless-stopped

volumes:
  db-data-dev:
  odoo-filestore-dev:
